<style>
/* Layout concept: a terminology map for screen-sharing on Zoom. Four group cards around a central ABC pill, framed by a dashed ethics band; five pathways light up chips across groups; detail views carry definitions and examples. */
:root {
  --bg: #F5F7FB; --surface: #FFFFFF; --fg: #16213A; --muted: #5B6578; --line: #D9DEE8;
  --navy: #1F3864; --teal: #1F7A78; --gold: #8A6700; --plum: #6B3E75; --slate: #5B6578;
  --navy-t: #E8EDF6; --teal-t: #E9F4F3; --gold-t: #FBF0D3; --plum-t: #F1E9F4; --slate-t: #EDF0F5;
  --on: #FFFFFF; --note-bg: #FBF0D3; --note-fg: #5A4300; --accent: #BF9000;
  --font-display: 'Amiri', 'Traditional Arabic', 'Noto Naskh Arabic', serif;
  --font-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1524; --surface: #162036; --fg: #E7ECF6; --muted: #9AA6BD; --line: #2A3650;
    --navy: #8FA8D8; --teal: #5DBDB9; --gold: #E0B53A; --plum: #C39BD3; --slate: #9AA6BD;
    --navy-t: #1B2740; --teal-t: #123432; --gold-t: #3A3010; --plum-t: #2E2236; --slate-t: #1C2740;
    --on: #0E1524; --note-bg: #3A3010; --note-fg: #F2DDA0; --accent: #E0B53A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1524; --surface: #162036; --fg: #E7ECF6; --muted: #9AA6BD; --line: #2A3650;
  --navy: #8FA8D8; --teal: #5DBDB9; --gold: #E0B53A; --plum: #C39BD3; --slate: #9AA6BD;
  --navy-t: #1B2740; --teal-t: #123432; --gold-t: #3A3010; --plum-t: #2E2236; --slate-t: #1C2740;
  --on: #0E1524; --note-bg: #3A3010; --note-fg: #F2DDA0; --accent: #E0B53A;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.75; padding-inline: 16px; padding-block: 20px 40px; }
* { box-sizing: border-box; }
.wrap { max-width: 1240px; margin-inline: auto; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.en { direction: ltr; unicode-bidi: isolate; font-family: var(--font-body); }

header.top h1 { font-family: var(--font-display); font-size: 32px; line-height: 1.3; margin: 0 0 4px; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-block: 18px 12px; }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; font-size: 14px; }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.paths { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
.paths-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.paths-row .lbl { font-size: 13px; color: var(--muted); margin-inline-end: 6px; }
.pbtn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 2px 12px; font-size: 14px; }
.pbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on); font-weight: 600; }
.pline { margin: 10px 0 0; font-size: 14.5px; max-width: 78ch; }
.pline b { font-family: var(--font-display); font-size: 18px; display: block; }
.strip { display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; margin-top: 10px; }
.strip .st { border: 1px solid var(--c, var(--line)); background: var(--t, var(--bg)); border-radius: 8px; padding: 0 10px; font-size: 13.5px; }
.strip .ar-sep { color: var(--muted); font-size: 13px; }

.g-p { --c: var(--navy); --t: var(--navy-t); }
.g-s { --c: var(--teal); --t: var(--teal-t); }
.g-r { --c: var(--gold); --t: var(--gold-t); }
.g-m { --c: var(--plum); --t: var(--plum-t); }
.g-e { --c: var(--slate); --t: var(--slate-t); }

.shell { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.shell.two { grid-template-columns: minmax(0, 1fr) 340px; }
.shell:not(.two) #detail { display: none; }

.frame { border: 2px dashed var(--slate); border-radius: 16px; padding: 14px; background: color-mix(in srgb, var(--surface) 60%, transparent); }
.frame-label { display: inline-flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; border: 0; background: var(--slate-t); border-radius: 8px; padding: 2px 12px; font-family: var(--font-display); font-size: 18px; margin-bottom: 12px; }
.frame-label small { font-family: var(--font-body); font-size: 12px; color: var(--muted); }
.map { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.center { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-block: -2px; }
.center::before, .center::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.cpill { border: 1.5px solid var(--fg); background: var(--surface); border-radius: 999px; padding: 4px 18px; text-align: center; line-height: 1.4; }
.cpill b { font-family: var(--font-display); font-size: 17px; display: block; }
.cpill span { font-size: 12px; color: var(--muted); }

.grp { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 10px; padding: 12px 12px 6px; }
.grp h3 { font-family: var(--font-display); font-size: 22px; margin: 0; line-height: 1.3; }
.grp h3 small { font-family: var(--font-body); font-size: 12.5px; color: var(--muted); font-weight: 400; margin-inline-start: 8px; }
.grp .q { margin: 0 0 8px; font-size: 13.5px; color: var(--c); font-weight: 500; }
.cl { margin-bottom: 8px; }
.cl-h { font-size: 12.5px; color: var(--muted); margin: 0 0 4px; letter-spacing: 0.02em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; border: 1px solid var(--c); background: var(--t); border-radius: 8px; padding: 2px 10px; text-align: start; line-height: 1.35; }
.chip .a { display: block; font-size: 14.5px; font-weight: 500; }
.chip .en { display: block; font-size: 11.5px; color: var(--muted); }
.chip:hover { background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--c); color: var(--on); }
.chip[aria-pressed="true"] .en { color: var(--on); opacity: 0.85; }
.chip.dim { opacity: 0.3; }
.chip.inpath { border-width: 2px; padding: 1px 9px; }
.chip .no { position: absolute; inset-block-start: -8px; inset-inline-end: -6px; background: var(--accent); color: var(--on); font-size: 11px; font-weight: 600; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; line-height: 1; padding-inline: 4px; }
.frame .g-e.ecl { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ecl .cl-h { margin: 0; margin-inline-end: 4px; }

#detail { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c, var(--line)); border-radius: 10px; padding: 14px 16px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; }
#detail h2 { font-family: var(--font-display); font-size: 26px; line-height: 1.3; margin: 0; }
#detail .meta { font-size: 12.5px; color: var(--muted); margin: 2px 0 10px; }
#detail .lbl, .card .lbl { font-size: 12px; color: var(--muted); letter-spacing: 0.03em; margin: 10px 0 0; }
#detail p, .card p { margin: 0; }
.note { background: var(--note-bg); color: var(--note-fg); border-radius: 8px; padding: 6px 12px; margin-top: 10px; font-size: 13.5px; }
.empty { color: var(--muted); }
.close { display: none; position: absolute; inset-block-start: 8px; inset-inline-start: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 0 10px; font-size: 13px; }
.tagrow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.ptag { font-size: 12px; border: 1px solid var(--accent); color: var(--fg); border-radius: 6px; padding: 0 8px; }
.open-grp { margin-top: 12px; border: 1px solid var(--c); background: var(--t); border-radius: 8px; padding: 2px 12px; font-size: 14px; }

.gview h2 { font-family: var(--font-display); font-size: 30px; margin: 0; line-height: 1.3; }
.gview .q { color: var(--c); font-weight: 500; margin: 0 0 14px; }
.gview .cl-title { font-family: var(--font-display); font-size: 21px; margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--c); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.gview .cl-title small { font-family: var(--font-body); font-size: 12.5px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 12px; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.card.dim { opacity: 0.35; }
.card.flash { outline: 3px solid var(--accent); }
.card h4 { font-family: var(--font-display); font-size: 20px; margin: 0; line-height: 1.35; }
.card .en.t { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.card .no { position: absolute; inset-block-start: 10px; inset-inline-end: 10px; background: var(--accent); color: var(--on); font-size: 12px; font-weight: 600; min-width: 22px; height: 22px; border-radius: 11px; display: grid; place-items: center; }
.card .links { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.lk { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 0 8px; font-size: 12.5px; }
.lk:hover { border-color: var(--c); }

.nview h2 { font-family: var(--font-display); font-size: 30px; margin: 0 0 4px; }
.nview > p { color: var(--muted); margin: 0 0 14px; max-width: 70ch; }
.nrow { background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--accent); border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 2px 14px; }
.nrow h4 { grid-column: 1 / -1; font-family: var(--font-display); font-size: 20px; margin: 0; }
.nrow .k { font-size: 12.5px; color: var(--muted); }
.nrow .v { min-width: 0; }

@media (max-width: 960px) {
  .shell.two { grid-template-columns: minmax(0, 1fr); }
  #detail { position: fixed; inset-inline: 0; bottom: 0; top: auto; max-height: 62vh; border-radius: 14px 14px 0 0; border-width: 1px; border-top-width: 4px; z-index: 5; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: none; box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.18); }
  #detail.open { display: block; }
  .close { display: block; }
  #detail h2 { padding-inline-start: 64px; }
}
@media (max-width: 720px) {
  .clb .nm .en { display: block; margin: 0; }
  .map { grid-template-columns: minmax(0, 1fr); }
  header.top h1 { font-size: 23px; }
  .nrow { grid-template-columns: minmax(0, 1fr); }
}

header.top .brand-unused { display: inline-block; font-size: 12.5px; letter-spacing: 0.04em; color: var(--teal); border: 1px solid var(--teal); border-radius: 999px; padding: 0 12px; margin-bottom: 8px; direction: ltr; }
.rights { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); max-width: 80ch; }
.clb { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 4px 0; text-align: start; border-bottom: 1px solid var(--line); }
.clb:hover { background: var(--t); }
.clb .nm { font-size: 14.5px; font-weight: 500; flex: 1; min-width: 0; }
.clb .nm .en { font-size: 12px; color: var(--muted); font-weight: 400; margin-inline-start: 6px; }
.clb .cnt { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
.clb .chev { color: var(--c); font-size: 12px; transition: transform .15s; }
.clb[aria-expanded="true"] .chev { transform: rotate(-90deg); }
.cl .chips { margin-top: 8px; margin-bottom: 8px; }
.grp { padding-bottom: 10px; }
.toolrow { display: flex; justify-content: flex-end; margin: 0 0 8px; }
.toolrow button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 12px; font-size: 13px; }
.guide h2 { font-family: var(--font-display); font-size: 22px; margin: 0 0 6px; }
.guide ol { margin: 0; padding-inline-start: 20px; }
.guide li { margin-bottom: 6px; }
.pbtn { text-align: start; }
.pbtn.off { display: inline-grid; place-items: center; width: 34px; height: 30px; padding: 0; }

header.top { display: flex; align-items: center; gap: 16px; }
header.top .logo { flex: none; width: 76px; height: auto; aspect-ratio: 1555 / 1465; color: var(--navy); }
header.top .ttl { min-width: 0; }
.rights-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); }
.rights-row .rights { margin: 0; padding: 0; border: 0; flex: 1 1 280px; }
.slogan { flex: none; width: 260px; max-width: 100%; height: auto; border-radius: 10px; display: block; }
@media (max-width: 720px) { header.top .logo { width: 56px; } .slogan { width: 220px; } }

.sview h2 { font-family: var(--font-display); font-size: 30px; margin: 0; line-height: 1.3; }
.sview > .q { color: var(--muted); margin: 0 0 12px; }
.snav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.sj { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 10px; font-size: 13.5px; }
.sj:hover { border-color: var(--accent); }
.scn { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; max-width: 900px; scroll-margin-top: 12px; }
.scn header { display: flex; gap: 12px; align-items: center; }
.scn .sn { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--on); display: grid; place-items: center; font-weight: 600; font-size: 17px; }
.scn h3 { font-family: var(--font-display); font-size: 24px; line-height: 1.3; margin: 0; }
.scn .stag { margin: 0; font-size: 12.5px; color: var(--muted); }
.scn h4 { font-size: 13px; color: var(--muted); letter-spacing: 0.03em; margin: 16px 0 6px; font-weight: 500; }
.situ { white-space: pre-line; background: var(--bg); border-inline-start: 3px solid var(--accent); border-radius: 8px; padding: 10px 14px; margin: 12px 0 0; font-size: 16px; }
.qs { list-style: none; padding: 0; margin: 0; }
.qi { border-top: 1px solid var(--line); padding: 10px 0; }
.qi:first-child { border-top: 0; }
.qrow { display: flex; gap: 10px; align-items: flex-start; }
.qrow p { margin: 0; font-size: 16px; }
.qn { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--accent); display: grid; place-items: center; font-size: 13px; font-weight: 600; margin-top: 3px; }
.revbtn { margin: 8px 34px 0 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 0 12px; font-size: 13px; }
.revbtn[aria-expanded="true"] { border-color: var(--accent); }
.qchips { margin: 8px 34px 0 0; }
.tpanel { margin: 10px 34px 0 0; border: 1px solid var(--c); border-top-width: 3px; background: var(--t); border-radius: 10px; padding: 8px 14px 12px; }
.tpanel h5 { font-family: var(--font-display); font-size: 20px; margin: 0; line-height: 1.4; }
.tpanel h5 .en { font-family: var(--font-body); font-size: 12.5px; color: var(--muted); margin-inline-start: 6px; }
.tpanel .lbl { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.tpanel p { margin: 0; }
.gfig { margin: 12px 0 0; max-width: 560px; }
.gfig svg { width: 100%; height: auto; display: block; background: var(--bg); border-radius: 8px; }
.gfig .gl { stroke: var(--line); stroke-width: 1; }
.gfig .gt { fill: var(--muted); font-size: 14px; font-family: var(--font-body); }
.gfig .gline { fill: none; stroke: var(--navy); stroke-width: 2.2; }
.gfig .gd { fill: var(--navy); }
.gfig .ph { stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1.2; }
.gfig figcaption { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
@media (max-width: 720px) { .revbtn, .qchips, .tpanel { margin-inline-start: 0; margin-inline-end: 0; } .scn { padding: 12px; } }
@media (prefers-reduced-motion: no-preference) {
  .card.flash { transition: outline-color 0.4s; }
}
</style>
